<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bullsburg Certificate</title>
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
<link rel="stylesheet" href="fonts.css">
<style>
@page{size:letter landscape;margin:0}
*{box-sizing:border-box}
body{margin:0;background:#0A1F1A;color:#16241F;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.bar button,.bar a{font:700 16px 'Atkinson Hyperlegible',system-ui,sans-serif;border-radius:12px;padding:11px 18px;border:1px solid #E3C179;background:#E3C179;color:#0A1F1A;cursor:pointer;text-decoration:none}
.bar a{background:transparent;color:#F4EFE2;border-color:#3B5A50}
.fit{width:min(100%,1056px);aspect-ratio:11/8.5;container-type:inline-size}
.cert{width:100%;height:100%;background:#FBF8F1;position:relative;padding:3.2cqw 4cqw;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.cert::before{content:"";position:absolute;inset:1.4cqw;border:.35cqw solid #11302A;pointer-events:none}
.cert::after{content:"";position:absolute;inset:2.1cqw;border:.12cqw solid #C9A45A;pointer-events:none}
.logo{display:flex;align-items:center;gap:1cqw;margin-top:1.4cqw}
.logo svg{width:4.2cqw;height:4.2cqw}
.logo span{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:2.6cqw;color:#11302A}
.kicker{margin-top:2.2cqw;font-size:1.25cqw;letter-spacing:.32em;text-transform:uppercase;color:#8A6424;font-weight:700}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:4.3cqw;line-height:1.08;color:#11302A;margin:.9cqw 0 0}
.to{margin-top:auto;padding-top:1.6cqw;font-size:1.6cqw;color:#4F5B55}
.name{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:5cqw;color:#0A1F1A;margin-top:.5cqw;padding:0 3cqw .6cqw;border-bottom:.15cqw solid #C9A45A;min-width:45%;overflow-wrap:anywhere}
.what{margin-top:1.8cqw;font-size:1.75cqw;line-height:1.5;max-width:76%;color:#16241F}
.what b{color:#11302A}
.row{margin-top:auto;width:84%;display:flex;justify-content:space-between;align-items:flex-end;gap:2cqw}
.sig{flex:1;font-size:1.3cqw;color:#4F5B55;border-top:.12cqw solid #11302A;padding-top:.6cqw}
.sig b{display:block;color:#16241F;font-size:1.5cqw}
.seal{width:11cqw;height:11cqw;border-radius:50%;background:#11302A;color:#E3C179;display:flex;flex-direction:column;align-items:center;justify-content:center;border:.5cqw double #E3C179;flex:none}
.seal b{font-family:Fraunces,Georgia,serif;font-size:3.1cqw;line-height:1}
.seal small{font-size:.95cqw;letter-spacing:.14em;text-transform:uppercase;margin-top:.3cqw}
.fine{margin-top:1.6cqw;font-size:.95cqw;color:#5E6A64;max-width:86%;line-height:1.45}
.bad{color:#F4EFE2;max-width:560px;text-align:center;font-size:18px;line-height:1.5}
@media print{body{background:#fff;padding:0;display:block}.bar{display:none}.fit{width:11in;height:8.5in;aspect-ratio:auto;container-type:size}.cert{box-shadow:none}
  .fit{container-type:inline-size}}
</style><style id="bb17">/* Bullsburg 1.7 brand */:root{--bg:#FFFFFF;--card:#FFFFFF;--ink:#0B1F33;--muted:#4A5A68;--line:#E3EAE7;--accent:#05803F;--sun:#05803F;--gold:#05803F}body{background:#fff;color:var(--ink);font-family:Poppins,system-ui,sans-serif}h1,h2,h3{font-family:Poppins,system-ui,sans-serif!important;font-weight:800;letter-spacing:-.02em}a{color:var(--accent)}.bbbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}.bbbar .bw{max-width:1040px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.bbl{display:flex;align-items:center;gap:9px;text-decoration:none}.bbl b{font-family:Montserrat,Poppins,sans-serif;font-weight:700;font-size:17px;letter-spacing:.14em;color:#05803F}.bbcta{background:#05803F;color:#fff!important;text-decoration:none;font-weight:700;border-radius:999px;padding:9px 18px;font-size:15px;white-space:nowrap}.bbhero{background:#fff!important;color:var(--ink)!important;padding:44px 16px 20px!important}.bbhero b{color:var(--ink)}.bbhero a{color:var(--accent)!important}.pill{display:inline-block;background:#E6F6EC;color:#05803F;font-weight:700;font-size:14px;padding:6px 14px;border-radius:999px;margin-bottom:12px}.bbhero h1{font-size:clamp(32px,5vw,48px);line-height:1.08;margin:0 0 12px}.bbhero h1 em{font-style:normal;color:#05803F}.bbhero .sub{font-size:19px;color:var(--muted);margin:0}.kick{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}.psr{max-width:760px;margin:0 auto;padding:0 16px}.psr h2{font-size:26px;line-height:1.15;margin:0 0 14px}.psr .blk{padding:26px 0;border-top:1px solid var(--line)}.psr .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.psr .c{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 2px 10px rgba(11,31,51,.05)}.psr .c b{display:block;font-size:17px}.psr .c span{color:var(--muted);font-size:15px}.psr .res{background:#05803F;color:#fff;border-radius:20px;padding:22px 22px;margin:8px 0 20px}.psr .res h2{color:#fff}.psr .res ul{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.psr .res li{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 12px;font-weight:700;margin:0}.psr .res li::before{content:"\2713  ";color:#EBC77C}body{background:#F4F7F6!important}.bar button{background:#05803F!important;border-color:#05803F!important;color:#fff!important;font-family:Poppins,sans-serif!important}.bar a{color:#0B1F33!important;border-color:#E3EAE7!important;background:#fff!important;font-family:Poppins,sans-serif!important}.bad{color:#0B1F33!important}.logo img{width:4.6cqw;height:4.6cqw}.logo span{font-family:Montserrat,Poppins,sans-serif!important;letter-spacing:.14em;color:#05803F!important;font-weight:700!important}h1,.name{font-family:Poppins,sans-serif!important}.seal{background:#05803F!important;border-color:#EBC77C!important}.cert::before{border-color:#05803F!important}.cert::after{border-color:#EBC77C!important}h1{color:#0B1F33!important}.kicker{color:#05803F!important}</style><link rel="icon" type="image/png" sizes="48x48" href="/bullsburg-icon-48.png"><link rel="icon" type="image/png" sizes="96x96" href="/bullsburg-icon-96.png"><link rel="icon" type="image/png" sizes="192x192" href="/bullsburg-icon-192.png"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png"></head><body>
<div class="bar"><button id="print" type="button">Print or save as PDF</button><a href="./">Open Bullsburg</a></div>
<div class="fit" id="fit"></div>
<script>
(function () {
  var q = new URLSearchParams(location.search), esc = function (t) { return String(t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var name = (q.get('n') || '').trim().slice(0, 40), score = parseInt(q.get('s'), 10), d = q.get('d') || '', when = new Date(d + 'T12:00:00');
  var fit = document.getElementById('fit');
  if (!name || !(score >= 70 && score <= 100) || isNaN(when)) {
    fit.outerHTML = '<p class="bad">This certificate link is incomplete. Open Bullsburg, go to W!SE Prep, and tap <b>Get my certificate</b> after passing a full practice test.</p>';
    document.getElementById('print').hidden = true; return;
  }
  document.title = 'Bullsburg Certificate · ' + name;
  var date = when.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  fit.innerHTML = '<div class="cert">' +
    '<div class="logo"><img src="bullsburg-mark.svg" alt=""><span>BULLSBURG</span></div>' +
    '<div class="kicker">Practice achievement</div><h1>Financial Literacy Certification Ready</h1>' +
    '<div class="to">This recognizes that</div><div class="name">' + esc(name) + '</div>' +
    '<div class="what">scored <b>' + score + '%</b> on a full-length financial literacy practice test, above the <b>70% passing line</b>, covering income, budgeting, banking, credit, saving and investing, insurance and big purchases.</div>' +
    '<div class="row"><div class="sig"><b>' + esc(date) + '</b>Date earned</div><div class="seal" aria-label="Score ' + score + ' percent"><b>' + score + '%</b><small>Practice</small></div><div class="sig"><b>Bullsburg LLC</b>bullsburg.com</div></div>' +
    '<div class="fine">Earned in the Bullsburg app from the student’s own practice results. This is a practice achievement, not an official certification of any kind. Official financial literacy tests, like the W!SE test, are given by schools. W!SE is a trademark of Working in Support of Education, which is not affiliated with Bullsburg.</div></div>';
  document.getElementById('print').onclick = function () { window.print(); };
})();
</script>
</body></html>
